name: Dump site content for setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print key theme files
        shell: bash
        run: |
          for f in \
            _includes/archive-single.html \
            _includes/author-profile.html \
            Gemfile \
            .github/workflows/jekyll.yml
          do
            echo "=== FILE: $f ==="
            cat "$f"
            echo
            echo "=== END FILE: $f ==="
          done
